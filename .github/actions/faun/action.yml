# Installs the faun command, built from one faun-lang commit, so every run
# tests and bundles with the same compiler. Moving to a newer compiler is
# changing `rev` here.
name: Install faun
description: Build the faun command from a pinned faun-lang commit, cached.

inputs:
  rev:
    description: The faun-lang commit to build.
    default: 416e9103470a101ce643f960c485841b0ac8f05d

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.95
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/faun
        key: faun-${{ inputs.rev }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --git https://github.com/faun-lang/faun --rev ${{ inputs.rev }} faun
